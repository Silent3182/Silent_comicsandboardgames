name: Zbuduj APK (Android)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'ARCHITEKTURA.md', 'moduly/**/README.md', 'android-native/README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testy:
    uses: ./.github/workflows/testy.yml

  apk:
    needs: testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Maven Central często odpowiada 429 (za dużo zapytań z serwerów GitHuba) – bierzemy biblioteki
      # z kopii Google (ta sama zawartość) i zapamiętujemy pobrane między budowami.
      - name: Kopia Maven Central i pamięć Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF2'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def swap = { repos -> repos.configureEach { r -> if (r instanceof MavenArtifactRepository && r.url.toString().contains('repo.maven.apache.org')) r.url = MIRROR } }
          beforeSettings { s -> swap(s.pluginManagement.repositories) }
          settingsEvaluated { s -> swap(s.dependencyResolutionManagement.repositories) }
          allprojects { swap(buildscript.repositories); swap(repositories) }
          EOF2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-capacitor6-${{ hashFiles('.github/workflows/apk.yml') }}
          restore-keys: gradle-capacitor6-

      - name: Przygotuj projekt Capacitor
        run: |
          mkdir -p build/www
          cp -r index.html style.css manifest.webmanifest sw.js core moduly icons build/www/
          find build/www -name '*.py' -delete; rm -rf build/www/moduly/*/narzedzia
          cd build
          cat > package.json <<'EOF'
          { "name": "moje-kolekcje", "version": "0.1.0", "private": true }
          EOF
          cat > capacitor.config.json <<'EOF'
          { "appId": "pl.silent.mojekolekcje", "appName": "Moje kolekcje", "webDir": "www",
            "android": { "allowMixedContent": false } }
          EOF
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6.0.2 @capacitor/share@6.0.3 @capacitor/local-notifications@6.1.3
          npx cap add android
          npx cap sync android

      - name: Uprawnienie do aparatu (skaner kodów)
        run: |
          cd build/android/app/src/main
          grep -q 'android.permission.CAMERA' AndroidManifest.xml || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' AndroidManifest.xml
          grep -q 'android.permission.CAMERA' AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' AndroidManifest.xml
          grep -n 'permission' AndroidManifest.xml

      - name: Widżet „Następny komiks” i powiadomienia (android-native/)
        run: |
          APP=build/android/app/src/main
          PKG=$APP/java/pl/silent/mojekolekcje
          mkdir -p $PKG
          cp android-native/java/*.java $PKG/
          cp -r android-native/res/. $APP/res/
          grep -q 'WidzetCzytanie' $APP/AndroidManifest.xml || sed -i 's#</application>#    <receiver android:name=".WidzetCzytanie" android:exported="false" android:label="@string/wz_nazwa">\n            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widzet_czytanie" />\n        </receiver>\n    </application>#' $APP/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' $APP/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $APP/AndroidManifest.xml
          cat $APP/AndroidManifest.xml

      - name: Ikona aplikacji
        run: |
          cd build/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher.png"
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done

      - name: Zbuduj APK
        run: |
          # Podpis zawsze tym samym kluczem z repo – inaczej Android odrzuca aktualizację („Nie zaktualizowano”).
          KS="$GITHUB_WORKSPACE/android-build/klucz.keystore"
          cd build/android
          cat >> app/build.gradle <<EOF2
          android {
              signingConfigs {
                  stalyKlucz {
                      storeFile file('$KS')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.stalyKlucz } }
          }
          EOF2
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" app/build.gradle
          # Maven czasem odpowiada 429 (za dużo zapytań) – ponów do 3 razy
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon -q && break; [ $i = 3 ] && exit 1; echo "Ponawiam budowanie ($i)…"; sleep $((i*45)); done
          cp app/build/outputs/apk/debug/app-debug.apk ../../moje-kolekcje.apk
          # kontrola: APK musi mieć podpis z klucza w repo
          unzip -p ../../moje-kolekcje.apk 'META-INF/*.RSA' > /tmp/c.rsa
          A=$(keytool -printcert -file /tmp/c.rsa | grep -m1 'SHA256:')
          B=$(keytool -list -v -keystore "$KS" -storepass android | grep -m1 'SHA256:')
          echo "APK: $A"; echo "Klucz: $B"
          [ "$A" = "$B" ] || { echo 'Zły podpis APK'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: moje-kolekcje-apk
          path: moje-kolekcje.apk

      - name: Wydanie z plikiem APK
        if: github.ref == 'refs/heads/main'   # z innych gałęzi tylko próbna budowa (plik w Artifacts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Moje kolekcje 0.1.${{ github.run_number }}
          body: |
            Plik do zainstalowania na Androidzie: **moje-kolekcje.apk** (poniżej, w sekcji Assets).
            Najnowsza wersja zawsze pod: https://github.com/${{ github.repository }}/releases/latest/download/moje-kolekcje.apk
          files: moje-kolekcje.apk
          make_latest: true
