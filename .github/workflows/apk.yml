name: Zbuduj APK (Android)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'ARCHITEKTURA.md', 'moduly/**/README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Przygotuj projekt Capacitor
        run: |
          mkdir -p build/www
          cp -r index.html style.css manifest.webmanifest sw.js core moduly icons build/www/
          find build/www -name '*.py' -delete; rm -rf build/www/moduly/*/narzedzia
          cd build
          cat > package.json <<'EOF'
          { "name": "moje-kolekcje", "version": "0.1.0", "private": true }
          EOF
          cat > capacitor.config.json <<'EOF'
          { "appId": "pl.silent.mojekolekcje", "appName": "Moje kolekcje", "webDir": "www",
            "android": { "allowMixedContent": false } }
          EOF
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6.0.2 @capacitor/share@6.0.3
          npx cap add android
          npx cap sync android

      - name: Ikona aplikacji
        run: |
          cd build/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher.png"
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done

      - name: Zbuduj APK
        run: |
          mkdir -p ~/.android
          cp android-build/klucz.keystore ~/.android/debug.keystore
          cd build/android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" app/build.gradle
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../moje-kolekcje.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moje-kolekcje-apk
          path: moje-kolekcje.apk

      - name: Wydanie z plikiem APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Moje kolekcje 0.1.${{ github.run_number }}
          body: |
            Plik do zainstalowania na Androidzie: **moje-kolekcje.apk** (poniżej, w sekcji Assets).
            Najnowsza wersja zawsze pod: https://github.com/${{ github.repository }}/releases/latest/download/moje-kolekcje.apk
          files: moje-kolekcje.apk
          make_latest: true
