name: Odśwież kalendarz imprez

# Co tydzień pobiera kalendarz konwentów (konwenty-poludniowe.pl) do wydarzenia.json,
# żeby wersja w przeglądarce (Windows) miała świeże imprezy bez telefonu.
# Zmienia tylko plik wydarzenia.json (push z GITHUB_TOKEN nie uruchamia budowania APK).
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kalendarz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz kalendarz konwentów
        run: python3 moduly/kalendarz/narzedzia/pobierz.py wydarzenia.json
      - name: Zapisz zmiany
        run: |
          git diff --quiet -- wydarzenia.json && { echo 'Bez zmian'; exit 0; }
          git config user.name 'kalendarz-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add wydarzenia.json
          git commit -m 'Kalendarz imprez: odświeżenie z konwenty-poludniowe.pl'
          git push
