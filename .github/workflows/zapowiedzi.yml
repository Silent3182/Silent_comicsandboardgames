name: Zapowiedzi Egmontu

on:
  schedule:
    - cron: '17 5 * * 1'   # w każdy poniedziałek rano
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zapowiedzi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz zapowiedzi z egmont.pl
        run: python3 .github/scripts/zapowiedzi.py zapowiedzi.json
      - name: Zapisz zmiany
        run: |
          git config user.name "zapowiedzi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add zapowiedzi.json
          git diff --cached --quiet || (git commit -m "Zapowiedzi Egmontu $(date +%F)" && git push)
