name: Testy aplikacji

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright (Chromium)
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Test całej aplikacji
        run: node testy/test-aplikacji.js
