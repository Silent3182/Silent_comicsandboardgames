<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dołącz do gry</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f3ee;--surface:#fff;--surface2:#efece5;--text:#1a1f26;--muted:#5d6673;--line:#e2ddd2;--accent:#1f3f68;--on-accent:#fff;--ok:#2c7a47;--ok-soft:#d3ebc2;--bad:#b3412e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--surface:#1b2129;--surface2:#242c36;--text:#ebe8e1;--muted:#9ea7b2;--line:#2f3843;--accent:#8fb6e8;--on-accent:#0f1620;--ok:#6cc890;--ok-soft:#22402c;--bad:#ec8470;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{margin:4px 0 2px;font-size:26px}
small.k{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input{font:inherit;color:var(--text);width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px}
.score{font-size:34px;text-align:center;font-weight:800}
.cols{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.cols button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cols button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.btn{font:inherit;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:18px;margin-top:14px;cursor:pointer}
.btn.g{background:var(--surface2);color:var(--text);font-weight:600;font-size:15px;min-height:44px}
.p{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.p:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}
.p .n{flex:1}
.p .s{font-variant-numeric:tabular-nums;font-weight:700}
.me{font-size:12px;color:var(--muted)}
.st{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
.ok{background:var(--ok-soft);border-radius:12px;padding:10px 12px;margin-top:12px}
.err{color:var(--bad)}
</style>
</head>
<body>
<main id="m"><p>Wczytywanie…</p></main>
<script>
/* Strona gościa trybu imprezy („Moje kolekcje”). Kanał z adresu (#t=…), wiadomości przez ntfy.sh.
 * Wysyłamy tylko: imię, kolor i wynik. Wszystko, co przychodzi, wstawiamy jako tekst. */
(function () {
  const RELAY = 'https://ntfy.sh/';
  const PALETA = ['#2f6fde', '#e0242f', '#2c9a57', '#e09b17', '#8a3ffc', '#14a89b', '#f06a24', '#d6337f', '#4b5bd6', '#6b7280'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const m = document.getElementById('m');
  const topic = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  if (!/^mk[a-z0-9]{10,40}$/.test(topic)) { m.innerHTML = '<h1>Ups</h1><p>Ten kod jest niepełny. Zeskanuj go jeszcze raz.</p>'; return; }
  const LS = 'impreza.gosc.' + topic;
  const ls = { get() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }, set(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} } };
  const imie0 = (() => { try { return localStorage.getItem('impreza.imie') || ''; } catch (e) { return ''; } })();
  let ja = ls.get() || { gid: [...crypto.getRandomValues(new Uint8Array(12))].map(x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''), name: imie0, color: PALETA[Math.floor(Math.random() * PALETA.length)], joined: false, score: null };
  let host = null, lastId = 'all', conn = true;

  async function wyslij(o) {
    const r = await fetch(RELAY + topic, { method: 'POST', body: JSON.stringify(Object.assign({ t: 'g', gid: ja.gid }, o)) });
    if (!r.ok) throw new Error('Serwer odpowiedział: ' + r.status);
  }
  async function odbierz() {
    try {
      const r = await fetch(RELAY + topic + '/json?poll=1&since=' + encodeURIComponent(lastId), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const lines = (await r.text()).split('\n').filter(Boolean);
      let zm = false;
      for (const l of lines) { let x; try { x = JSON.parse(l); } catch (e) { continue; } if (x.event !== 'message') continue; lastId = x.id; let o; try { o = JSON.parse(x.message); } catch (e) { continue; } if (o && o.t === 'h') { host = o; zm = true; } }
      conn = true; if (zm) rysuj(); else stan();
    } catch (e) { conn = false; stan(); }
  }
  function stan() { const s = document.getElementById('st'); if (s) s.innerHTML = conn ? '' : '<span class="err">Brak połączenia – sprawdź internet.</span>'; }
  const av = (n, c) => `<span class="av" style="background:${/^#[0-9a-f]{6}$/i.test(c || '') ? c : '#6b7280'}">${esc(String(n || '?').trim().charAt(0).toUpperCase())}</span>`;

  function rysuj() {
    const gra = host && host.gra ? host.gra : '';
    if (host && host.faza === 'koniec') { m.innerHTML = `<small class="k">Tryb imprezy</small><h1>Dzięki za grę!</h1><p>Gospodarz zakończył rozgrywkę${gra ? ' w „' + esc(gra) + '”' : ''}. Możesz zamknąć tę stronę.</p>`; return; }
    if (!ja.joined) {
      m.innerHTML = `<small class="k">Tryb imprezy</small><h1>${gra ? esc(gra) : 'Dołącz do gry'}</h1>
        <div class="card"><label for="n">Jak masz na imię?</label><input id="n" maxlength="30" autocomplete="given-name" value="${esc(ja.name)}" placeholder="np. Kasia">
          <label style="margin-top:14px">Twój kolor</label><div class="cols">${PALETA.map(c => `<button type="button" data-c="${c}" class="${c === ja.color ? 'on' : ''}" style="background:${c}" aria-label="kolor"></button>`).join('')}</div>
          <button class="btn" id="go">Dołączam!</button><div id="er" class="err"></div></div>
        <p class="st">Wysyłane jest tylko Twoje imię, kolor i wynik. Nic nie instalujesz.</p><div id="st" class="st"></div>`;
      m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ja.color = b.dataset.c; m.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
      m.querySelector('#go').onclick = async () => {
        const n = m.querySelector('#n').value.trim().slice(0, 30); if (!n) { m.querySelector('#er').textContent = 'Wpisz imię.'; return; }
        ja.name = n; try { localStorage.setItem('impreza.imie', n); } catch (e) {}
        try { await wyslij({ name: ja.name, color: ja.color }); ja.joined = true; ls.set(ja); rysuj(); odbierz(); }
        catch (e) { m.querySelector('#er').textContent = 'Nie udało się dołączyć – sprawdź internet i spróbuj jeszcze raz.'; }
      };
      return;
    }
    const gr = (host && Array.isArray(host.gracze) ? host.gracze : []).slice(0, 30);
    const wyniki = host && host.faza === 'wyniki';
    m.innerHTML = `<small class="k">Tryb imprezy</small><h1>${gra ? esc(gra) : 'Jesteś w grze!'}</h1>
      <div class="ok">✅ Dołączono jako <b>${esc(ja.name)}</b></div>
      ${wyniki ? `<div class="card"><label for="sc">Twój wynik</label><input id="sc" class="score" type="number" inputmode="decimal" step="any" value="${ja.score == null ? '' : esc(ja.score)}" placeholder="0"><button class="btn" id="ss">Wyślij wynik</button><div id="sok" class="st"></div></div>` : `<p class="st">Gdy skończycie, gospodarz poprosi o wyniki – pole pojawi się tutaj samo.</p>`}
      <div class="card"><b>Przy stole</b>${gr.length ? gr.map(p => `<div class="p">${av(p.name, p.color)}<span class="n">${esc(p.name)}${p.gid === ja.gid ? ' <span class="me">(Ty)</span>' : ''}</span>${p.score != null && p.score !== '' ? `<span class="s">${esc(p.score)}</span>` : ''}</div>`).join('') : '<p class="st">Czekam na gospodarza…</p>'}</div>
      <button class="btn g" id="zm">Zmień imię lub kolor</button><button class="btn g" id="out">Wypisz mnie</button>
      <div id="st" class="st"></div>`;
    const ss = m.querySelector('#ss');
    if (ss) ss.onclick = async () => {
      const v = m.querySelector('#sc').value.replace(',', '.'); if (v === '' || isNaN(+v)) return;
      ja.score = +v; ls.set(ja);
      try { await wyslij({ name: ja.name, color: ja.color, score: ja.score }); m.querySelector('#sok').textContent = 'Wysłano ✓'; } catch (e) { m.querySelector('#sok').innerHTML = '<span class="err">Nie wysłano – spróbuj jeszcze raz.</span>'; }
    };
    m.querySelector('#zm').onclick = () => { ja.joined = false; rysuj(); };
    m.querySelector('#out').onclick = async () => { try { await wyslij({ leave: true }); } catch (e) {} ja.joined = false; ls.set(ja); rysuj(); };
    stan();
  }
  rysuj(); odbierz();
  setInterval(() => { if (!document.hidden) odbierz(); }, 3000);
})();
</script>
</body>
</html>
